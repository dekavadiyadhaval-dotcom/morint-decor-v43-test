const K='decor_demo_v1';let db=JSON.parse(localStorage.getItem(K)||'null')||{products:[],parties:[],tx:[],orders:[]};// One-time targeted cleanup of the automatically generated demo purchase and designs.
// Keep all unrelated user records, parties, and transactions intact.
if(!db.decorDemoCleanup20261113){
 const demoId='china-purchase-designs-1-43';
 db.tx=(db.tx||[]).filter(t=>t.id!==demoId);
 const demoDesigns=new Set(Array.from({length:43},(_,i)=>String(i+1)));
 // These design numbers were automatically inserted by the earlier demo version.
 db.products=(db.products||[]).filter(p=>!demoDesigns.has(String(p.design).trim()));
 // The demo migration reset 500-PC opening stock to zero; do not guess at
 // restoring opening stock because it could change genuine inventory balances.
 db.decorChinaPurchaseMigration=true;
 db.decorDemoCleanup20261113=true;
 localStorage.setItem(K,JSON.stringify(db));
}
db.cities ||= [...new Set(db.parties.map(p=>p.city).filter(Boolean))];db.districts ||= [...new Set(db.parties.map(p=>p.district).filter(Boolean))];db.references ||= [...new Set(db.parties.map(p=>p.reference).filter(Boolean))];db.categories ||= [...new Set(db.products.map(p=>p.category).filter(Boolean))];db.sizes ||= [...new Set(db.products.map(p=>p.size).filter(Boolean))];db.weights ||= [...new Set(db.products.map(p=>p.weight).filter(Boolean))];for(const [key,value] of [['categories','MATT'],['sizes','8FT X 4FT'],['weights','4 KG']]){if(!db[key].some(x=>String(x).toLowerCase()===value.toLowerCase()))db[key].push(value)}db.categories=[...new Set(db.categories.map(x=>String(x).toLowerCase()==='matt'?'MATT':x))];db.weights=[...new Set(db.weights.map(x=>x==='4 KG PER PCS'?'4 KG':x))];localStorage.setItem(K,JSON.stringify(db));let page='Dashboard',draft=[],editingOrder=null;const save=()=>localStorage.setItem(K,JSON.stringify(db));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const srOrder=o=>db.orders.indexOf(o)+1;const srTx=t=>db.tx.filter(x=>x.kind===t.kind).indexOf(t)+1;const srBadge=n=>`<span style="display:inline-block;background:#e8f1ff;color:#1249a1;border-radius:7px;padding:4px 9px;margin-right:8px;font-weight:800">SR NO. ${n}</span>`;const qty=(a)=>a.reduce((s,x)=>s+Number(x.qty),0);const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);const prod=d=>db.products.find(p=>p.design.toLowerCase()===String(d).toLowerCase());const party=n=>db.parties.find(p=>p.name.toLowerCase()===String(n).toLowerCase());const remaining=o=>o.lines.map(l=>({...l,qty:l.qty-(o.closed[l.design]||0)})).filter(l=>l.qty>0);function openingStockPage(){
 let out='<section><h2>OPENING STOCK</h2><p class="hint">Design Number લખો. Design મળ્યાની સૂચના દેખાશે; Save કર્યા પછી જ નીચે Entry દેખાશે.</p><form onsubmit="saveOpeningStock(event)"><div class="line"><div><label>Design Number</label><input id="opening-design" placeholder="Type Design Number" autocomplete="off" oninput="openingDesignNotice()" required><div id="opening-design-notice" class="hint" aria-live="polite">Design Number લખો.</div></div><div><label>Opening Quantity (SHEET)</label><input id="opening-qty" type="number" min="0" step="1" required></div></div><button type="submit">Save Opening Stock</button></form><h3>Opening Stock Entries</h3><table><tr><th>SR NO.</th><th>Design No.</th><th>Category</th><th>Opening SHEET</th><th>Action</th></tr>';
 for(const p of [...db.products].reverse().filter(p=>db.openingStockSavedDesigns.includes(p.design))){let n=db.products.indexOf(p)+1;out+='<tr><td>'+n+'</td><td>'+esc(p.design)+'</td><td>'+esc(p.category)+'</td><td>'+Number(db.openingStock[p.design]||0)+'</td><td><button type="button" class="secondary" onclick="editOpeningStock(\''+encodeURIComponent(p.design)+'\')">Edit</button></td></tr>'}
 if(!db.openingStockSavedDesigns.length)out+='<tr><td colspan="5">હજુ Opening Stock Add કરેલ નથી.</td></tr>';return out+'</table></section>';
}
function openingDesignNotice(){const input=document.getElementById('opening-design'),note=document.getElementById('opening-design-notice');if(!input||!note)return;const value=input.value.trim();if(!value){note.textContent='Design Number લખો.';note.style.color='';return;}const p=prod(value);if(p){note.textContent='✓ Design મળ્યો: '+p.design+' · '+(p.category||'');note.style.color='#147d45';}else{note.textContent='Design Number Product Master માં મળ્યો નથી.';note.style.color='#b45309';}}
function editOpeningStock(encoded){const d=decodeURIComponent(encoded),p=prod(d);if(!p)return;document.getElementById('opening-design').value=p.design;openingDesignNotice();document.getElementById('opening-qty').value=Number(db.openingStock[p.design]||0);document.getElementById('opening-qty').focus();window.scrollTo({top:0,behavior:'smooth'})}
function saveOpeningStock(e){e.preventDefault();const d=document.getElementById('opening-design').value.trim(),p=prod(d),v=Number(document.getElementById('opening-qty').value);if(!p)return alert('Design Number Product Master માં નથી.');if(!Number.isSafeInteger(v)||v<0)return alert('સાચી Quantity નાખો.');const old=Number(db.openingStock[p.design]||0);if(stock(p.design).ins-old+v<0)return alert('આ Quantity કરવાથી Stock Negative થાય છે.');db.openingStock[p.design]=v;if(!db.openingStockSavedDesigns.includes(p.design))db.openingStockSavedDesigns.push(p.design);save();show('OPENING STOCK')}

/* Stock-only report actions; all other formats remain unchanged. */
function stockReportHTML(){
 const ps=[...db.products].sort((a,b)=>String(a.design).localeCompare(String(b.design),undefined,{numeric:true,sensitivity:'base'}));
 let rows='',total={ins:0,reserved:0,available:0};
 let sr=0;
 for(const c of [...new Set(ps.map(p=>p.category))]){
  const group=ps.filter(p=>p.category===c),subtotal={ins:0,reserved:0,available:0};
  for(const p of group){const v=stock(p.design);sr++;for(const k of Object.keys(total)){total[k]+=Number(v[k]||0);subtotal[k]+=Number(v[k]||0)}
   rows+=`<tr><td>${sr}</td><td>${esc(p.design)}</td><td>${esc(p.category)}</td><td>${v.ins}</td><td>${v.reserved}</td><td>${v.available}</td></tr>`;
  }

function viewClosedOrder(oid){
 const blob=closedPdfBlob(oid);if(!blob)return;
 const url=URL.createObjectURL(blob);
 const w=window.open(url,'_blank');
 if(!w){alert('View માટે browser માં Pop-ups allow કરો.');URL.revokeObjectURL(url);return}
 setTimeout(()=>URL.revokeObjectURL(url),120000);
}
function closedLines(oid){
 const o=db.orders.find(x=>x.id===oid);if(!o)return null;
 return {o,lines:o.lines.map(l=>({...l,qty:o.closed[l.design]||0})).filter(l=>l.qty>0)};
}
function pdfEscape(t){return String(t??'').normalize('NFKD').replace(/[^\x20-\x7e]/g,'?').replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)')}
function closedPdfBlob(oid,printOnly=false){
 const r=closedLines(oid);if(!r)return null;
 const {o,lines}=r;
 const rows=[{cells:['Design No.','Category','Quantity'],kind:'header'}];
 for(const cat of [...new Set(lines.map(l=>l.category))]){
  for(const l of lines.filter(l=>l.category===cat))rows.push({cells:[l.design,l.category,String(l.qty)],kind:'normal'});
  rows.push({cells:[cat+' Total','',String(qty(lines.filter(l=>l.category===cat)))],kind:'subtotal'});
 }
 rows.push({cells:['GRAND TOTAL','',String(qty(lines))],kind:'grand'});
 // Closed-order-only category summary, after the completed order format.
 rows.push({cells:['','',''],kind:'spacer'});
 for(const cat of [...new Set(lines.map(l=>String(l.category||'UNCATEGORIZED').trim().toUpperCase()))]){
  const catQty=lines.filter(l=>String(l.category||'UNCATEGORIZED').trim().toUpperCase()===cat).reduce((n,l)=>n+Number(l.qty||0),0);
  rows.push({cells:[cat,'',catQty+' SHEET'],kind:'categorySummary'});
 }
 rows.push({cells:['GRAND TOTAL','',qty(lines)+' SHEET'],kind:'summaryGrand'});
 const pages=[];for(let i=0;i<rows.length;i+=25)pages.push(rows.slice(i,i+25));

function pdfFromCanvas(canvas){
 const data=atob(canvas.toDataURL('image/jpeg',0.92).split(',')[1]);
 const img=new Uint8Array(data.length);for(let i=0;i<data.length;i++)img[i]=data.charCodeAt(i);
 const enc=new TextEncoder(),chunks=[],offsets=[0];let length=0;
 function push(t){const b=typeof t==='string'?enc.encode(t):t;chunks.push(b);length+=b.length}
 function obj(n,head,stream){
   offsets[n]=length;push(`${n} 0 obj\n${head}`);
   if(stream){push(`\nstream\n`);push(stream);push('\nendstream')}
   push('\nendobj\n');
 }
 push('%PDF-1.4\n');
 obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
 obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
 obj(3,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im1 4 0 R >> >> /Contents 5 0 R >>');
 obj(4,`<< /Type /XObject /Subtype /Image /Width ${canvas.width} /Height ${canvas.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${img.length} >>`,img);
 const commands='q 595.28 0 0 841.89 0 0 cm /Im1 Do Q\n';
 obj(5,`<< /Length ${enc.encode(commands).length} >>`,enc.encode(commands));
 const xref=length;push('xref\n0 6\n0000000000 65535 f \n');
 for(let i=1;i<=5;i++)push(String(offsets[i]).padStart(10,'0')+' 00000 n \n');
 push(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
 return new Blob(chunks,{type:'application/pdf'});
}

 };

function saveOpenOrderEdit(oid){
 const o=db.orders.find(x=>x.id===oid);if(!o)return;
 const area=document.getElementById('order-details-'+oid);
 const selected=document.getElementById('edit-party-'+oid).value;
 if(!party(selected))return alert('Master માંથી Party પસંદ કરો');
 const values=new Map();
 for(const input of area.querySelectorAll('input[data-design]')){
  const n=Number(input.value);
  if(!Number.isInteger(n)||n<0)return alert('Quantity 0 અથવા વધારે પૂર્ણાંક હોવી જોઈએ');
  values.set(input.dataset.design,n);
 }
 const newLines=[...values].map(([design,openQty])=>{
  const p=prod(design),old=o.lines.find(l=>l.design===design);
  if(!p&&!old)return null;
  return {design,category:p?.category||old.category,qty:(o.closed[design]||0)+openQty};
 }).filter(Boolean);
 // Keep closed designs even if their open quantity was removed.
 for(const l of o.lines)if((o.closed[l.design]||0)>0&&!newLines.some(x=>x.design===l.design))newLines.push({...l,qty:o.closed[l.design]});
 if(!newLines.some(l=>l.qty>0))return alert('Order માં ઓછામાં ઓછી એક Quantity હોવી જોઈએ');
 // Existing closed sales retain their original party and quantity.
 if(Object.values(o.closed).some(q=>q>0)&&selected!==o.party)return alert('Partial Close Order માં Party બદલી શકાતી નથી');
 o.party=selected;o.lines=newLines.filter(l=>l.qty>0);
 save();render();
}

 shade.innerHTML='<div role="dialog" aria-modal="true" aria-label="Close order confirmation" style="background:white;color:#111;padding:24px;border-radius:12px;max-width:350px;width:100%;text-align:center"><h3>ARE YOU SURE CLOSE ORDER?</h3><div style="display:flex;gap:12px;justify-content:center"><button type="button" id="confirm-close-yes">YES</button><button type="button" id="confirm-close-no">NO</button></div></div>';
 document.body.appendChild(shade);

function proceedCloseOrder(oid,autoAmount=null){
 const o=db.orders.find(x=>x.id===oid);
 if(!o)return alert('Order મળ્યો નથી');
 const lines=remaining(o).filter(l=>Number(l.qty)>0);
 if(!lines.length)return alert('આ Order પહેલેથી Close થયેલો છે');
 const shortages=lines.filter(l=>stock(l.design).ins<Number(l.qty));
 if(shortages.length)return alert('In Stock પૂરતો નથી: '+shortages.map(l=>l.design+' (જરૂરી '+l.qty+', In Stock '+stock(l.design).ins+')').join(', '));
 // Close every open design together and create a single Sales transaction.
 lines.forEach(l=>{o.closed[l.design]=(o.closed[l.design]||0)+Number(l.qty)});
 const closeDate=new Date().toLocaleDateString('en-GB');
 o.closeDate=closeDate;
 // Store the optional manually-entered amount on the order, never on shared print templates.
 if(autoAmount!==null)o.autoAmount=autoAmount;
 db.tx.push({id:id(),kind:'Sales',party:o.party,date:closeDate,lines:lines.map(l=>({design:l.design,category:l.category,qty:Number(l.qty)})),orderId:o.id});

}

// Display dates in DD/MM/YYYY everywhere without altering stored transaction dates.
function decorDisplayDate(value){
 const v=String(value||'').trim();
 let m=v.match(/^(\d{4})-(\d{2})-(\d{2})$/);
 if(m)return m[3]+'/'+m[2]+'/'+m[1];
 m=v.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);
 if(m)return m[1].padStart(2,'0')+'/'+m[2].padStart(2,'0')+'/'+m[3];
 return v;
}
function decorIsoDate(value){
 const m=String(value||'').trim().match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
 if(!m)return null;
 const d=new Date(Number(m[3]),Number(m[2])-1,Number(m[1]));
 if(d.getFullYear()!==Number(m[3])||d.getMonth()!==Number(m[2])-1||d.getDate()!==Number(m[1]))return null;
 return m[3]+'-'+m[2]+'-'+m[1];
}

}

let highSellingReturnPosition=null;
function highSellingDesignReport(){
 const totalsByDesign=new Map();
 // Only quantities actually closed on orders count as high-selling.
 // Open orders and independent transactions are excluded.
 for(const o of db.orders){
  for(const [design,amount] of Object.entries(o.closed||{})){
   const n=Number(amount)||0;
   if(n<=0)continue;
   totalsByDesign.set(design,(totalsByDesign.get(design)||0)+n);
  }
 }
 const rows=[...totalsByDesign.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],undefined,{numeric:true}));
 let html='<section><h2>HIGH SELLING DESIGN NO</h2><p class="hint">ફક્ત Close Order ની Quantity ગણાશે. Open Order ગણાશે નહીં.</p>';
 html+='<table><tr><th>Rank</th><th>Design No</th><th>Category</th><th>Closed Order Quantity (PCS)</th></tr>';
 rows.forEach(([design,total],i)=>{html+=`<tr id="high-design-${encodeURIComponent(design)}"><td>${i+1}</td><td><button type="button" class="secondary" onclick="showHighSellingDesignDetails(decodeURIComponent('${encodeURIComponent(design)}'))">${esc(design)}</button></td><td>${esc(prod(design)?.category||'')}</td><td><b>${total}</b></td></tr>`});
 if(!rows.length)html+='<tr><td colspan="4">હજુ કોઈ Close Order નથી.</td></tr>';
 html+='</table><button type="button" onclick="show(\'REPORT\')">Back to REPORT</button></section>';
 return html;
}

function showHighSellingDesignDetails(design){
 highSellingReturnPosition={design,scrollY:window.scrollY};
 const records=[];
 for(const o of db.orders){
  const amount=Number(o.closed?.[design]||0);
  if(amount<=0)continue;
  const sale=db.tx.filter(t=>t.kind==='Sales'&&t.orderId===o.id&&t.lines?.some(l=>String(l.design)===String(design))).slice(-1)[0];
  const date=o.closeDate||sale?.date||'Date not recorded';
  records.push({party:o.party,date,qty:amount});
 }
 records.sort((a,b)=>String(b.date).localeCompare(String(a.date)));
 let h=`<section><h2>DESIGN NO: ${esc(design)}</h2><p class="hint">Close Order Party-wise Details</p>`;
 h+='<table><tr><th>Party Name</th><th>Close Order Date</th><th>Quantity (PCS)</th></tr>';
 for(const r of records)h+=`<tr><td>${esc(r.party)}</td><td>${esc(r.date)}</td><td>${r.qty}</td></tr>`;
 h+=`<tr class="grand"><th colspan="2">TOTAL CLOSED QUANTITY</th><th>${records.reduce((sum,r)=>sum+r.qty,0)} PCS</th></tr></table>`;
 h+=`<p><button type="button" onclick="backToHighSellingDesign()">Back to HIGH SELLING DESIGN NO</button></p></section>`;
 document.getElementById('screen').innerHTML=h;
}
function backToHighSellingDesign(){
 const position=highSellingReturnPosition;
 show('HIGH SELLING DESIGN NO');
 requestAnimationFrame(()=>{
  const row=position&&document.getElementById('high-design-'+encodeURIComponent(position.design));
  if(row){row.scrollIntoView({block:'center'});row.style.outline='2px solid #3182ce';row.style.outlineOffset='-2px';}
  else if(position)window.scrollTo(0,position.scrollY);
 });
}

function ledgerISODate(value){
 const v=String(value||'').trim();
 if(/^\d{4}-\d{2}-\d{2}$/.test(v))return v;
 const m=v.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
 if(m)return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
 return '';
}
function ledgerDateInRange(date,from,to){
 const iso=ledgerISODate(date);
 return !!iso&&(!from||iso>=from)&&(!to||iso<=to);
}
function ledgerReturnsForParty(partyName,from='',to=''){
 return db.tx.filter(t=>t.kind==='Sales Return'&&String(t.party).trim().toLowerCase()===String(partyName).trim().toLowerCase()&&(!(from||to)||ledgerDateInRange(t.date,from,to)));
}
function ledgerReturnQuantity(partyName,from='',to=''){
 return ledgerReturnsForParty(partyName,from,to).reduce((sum,t)=>sum+qty(t.lines||[]),0);
}

function filterLedgerParties(){
 const input=document.getElementById('ledgerPartySearch');
 const results=document.getElementById('ledgerPartyResults');
 const notice=document.getElementById('ledgerSearchNotice');
 if(!input||!results)return;
 const from=document.getElementById('ledgerFromDate')?.value||'';
 const to=document.getElementById('ledgerToDate')?.value||'';
 const dateNotice=document.getElementById('ledgerDateNotice');
 if(from&&to&&from>to){notice.textContent='From Date, To Date કરતાં આગળ ન હોવી જોઈએ.';results.innerHTML='';return;}
 if(dateNotice)dateNotice.textContent=(from||to)?'ફક્ત પસંદ કરેલી Close Order તારીખોની Quantity ગણાશે.':'બધી તારીખોના Closed Orders ગણાશે.';
 const selectedParty=document.getElementById('ledgerPartySelect')?.value||'';
 const search=input.value.trim().toLocaleLowerCase();
 const parties=[...db.parties].sort((a,b)=>String(a.name).localeCompare(String(b.name),undefined,{sensitivity:'base',numeric:true}));
 const matches=parties.filter(p=>(!selectedParty||p.name===selectedParty)&&String(p.name).toLocaleLowerCase().includes(search));
 notice.textContent=(search||selectedParty)?(matches.length?`${matches.length} Party મળી — પસંદ કરેલી તારીખ પ્રમાણે Report નીચે છે`:'આ નામની Party મળતી નથી'):`કુલ ${parties.length} Party — A થી Z ક્રમમાં`;
 results.innerHTML=matches.length?matches.map(p=>{
  // Sum only the closed quantities on orders; open orders are not included.
  const total=db.orders.filter(o=>String(o.party).trim().toLocaleLowerCase()===String(p.name).trim().toLocaleLowerCase())
   .reduce((sum,o)=>{
    const closedQty=Object.values(o.closed||{}).reduce((n,q)=>n+(Number(q)||0),0);
    if(!closedQty)return sum;
    const saleDates=db.tx.filter(t=>t.kind==='Sales'&&t.orderId===o.id).map(t=>t.date).filter(Boolean).sort();
    const closeDate=o.closeDate||saleDates[saleDates.length-1]||'';
    if((from||to)&&!ledgerDateInRange(closeDate,from,to))return sum;
    return sum+closedQty;
   },0);
  const returned=ledgerReturnQuantity(p.name,from,to);
  const net=total-returned;
  return `<div style="border:1px solid #d8e0ea;border-radius:10px;padding:12px 15px;margin:7px 0;background:#f8fbff;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap"><div><button type="button" class="secondary" style="font-weight:700" onclick="showLedgerClosedOrders(decodeURIComponent('${encodeURIComponent(p.name)}'))">${esc(p.name)}</button><span style="color:#526174;margin-left:12px">${esc(p.city||'')}</span></div><div style="font-weight:700;color:#176045"><div>Total Close Order: ${total.toLocaleString('en-IN')} PCS</div><div style="color:#ad4c18">Sales Return: −${returned.toLocaleString('en-IN')} PCS</div><div style="color:#176045">Net Sales: ${net.toLocaleString('en-IN')} PCS</div></div></div>`;
 }).join(''):'<p class="hint">કોઈ Party મળી નથી.</p>';
}
let ledgerActiveParty='';
function showLedgerClosedOrders(partyName){
 ledgerActiveParty=partyName;
 const from=document.getElementById('ledgerFromDate')?.value||'';
 const to=document.getElementById('ledgerToDate')?.value||'';
 const records=[];
 for(const o of db.orders){
  if(String(o.party).trim().toLowerCase()!==String(partyName).trim().toLowerCase())continue;
  const lines=Object.entries(o.closed||{}).filter(([d,q])=>Number(q)>0);
  if(!lines.length)continue;
  const salesDates=db.tx.filter(t=>t.kind==='Sales'&&t.orderId===o.id).map(t=>t.date).filter(Boolean).sort((a,b)=>ledgerISODate(a).localeCompare(ledgerISODate(b)));
  const date=o.closeDate||salesDates[salesDates.length-1]||'';
  if((from||to)&&!ledgerDateInRange(date,from,to))continue;
  records.push({id:o.id,date,quantity:lines.reduce((n,[d,q])=>n+Number(q),0)});
 }
 records.sort((a,b)=>ledgerISODate(b.date).localeCompare(ledgerISODate(a.date)));
 const area=document.getElementById('ledgerOrderDetails');
 if(!area)return;
 let html=`<h3>${esc(partyName)} — Closed Order List</h3><p class="hint">${from||to?`From: ${esc(from||'All')} | To: ${esc(to||'All')}`:'All Dates'} · તારીખ પર ક્લિક કરો એટલે Full Close Order ખુલશે.</p>`;
 html+='<table><tr><th>Date / Entry</th><th>Quantity</th></tr>';
 for(const r of records)html+=`<tr><td><button type="button" class="secondary" onclick="showLedgerFullClosedOrder(decodeURIComponent('${encodeURIComponent(r.id)}'))">${esc(r.date||'Date not available')}</button></td><td>${r.quantity.toLocaleString('en-IN')} PCS</td></tr>`;
 const closedTotal=records.reduce((n,r)=>n+r.quantity,0);
 const returns=ledgerReturnsForParty(partyName,from,to).slice().sort((a,b)=>ledgerISODate(b.date).localeCompare(ledgerISODate(a.date)));
 for(const t of returns){html+=`<tr><td><button type="button" class="secondary" style="color:#fff;font-weight:700" onclick="showLedgerSalesReturnDetails(decodeURIComponent('${encodeURIComponent(t.id)}'))">↩ Sales Return · ${esc(t.date||'')} · View Details</button><div style="font-size:12px">${(t.lines||[]).map(l=>`${esc(l.design)}: ${Number(l.qty)||0} PCS`).join(', ')}</div></td><td style="color:#fff;background:#ad4c18;font-weight:700">−${qty(t.lines||[]).toLocaleString('en-IN')} PCS</td></tr>`;}
 const returnTotal=returns.reduce((n,t)=>n+qty(t.lines||[]),0);
 html+=`<tr class="subtotal"><th>TOTAL CLOSED QUANTITY</th><th>${closedTotal.toLocaleString('en-IN')} PCS</th></tr><tr class="subtotal"><th>SALES RETURN</th><th>−${returnTotal.toLocaleString('en-IN')} PCS</th></tr><tr class="grand"><th>NET SALES QUANTITY</th><th>${(closedTotal-returnTotal).toLocaleString('en-IN')} PCS</th></tr></table>`;
 if(!records.length&&!returns.length)html+='<p>આ Party માટે પસંદ કરેલી તારીખોમાં કોઈ Closed Order કે Sales Return નથી.</p>';
 html+='<p><button type="button" onclick="backToLedgerParties()">Back to PARTY LEDGER</button></p>';
 area.innerHTML=html;area.style.display='block';
 document.getElementById('ledgerPartyResults').style.display='none';
 area.scrollIntoView({block:'start'});
}

let designSalesFromDate='';
let designSalesToDate='';
function designSalesDateUpdate(){
 designSalesFromDate=document.getElementById('designSalesFrom')?.value||'';
 designSalesToDate=document.getElementById('designSalesTo')?.value||'';
 if(designSalesFromDate&&designSalesToDate&&designSalesFromDate>designSalesToDate){
  document.getElementById('designSalesDateError').textContent='From Date, To Date કરતાં મોટી ન હોઈ શકે.';
  return;
 }
 render();
}
function designSalesClearDates(){designSalesFromDate='';designSalesToDate='';render()}
function designSalesOrderInRange(o){
 if(!designSalesFromDate&&!designSalesToDate)return true;
 const salesDates=(db.tx||[]).filter(t=>t.kind==='Sales'&&String(t.orderId)===String(o.id)).map(t=>ledgerISODate(t.date)).filter(Boolean).sort();
 const closeDate=ledgerISODate(o.closeDate)||salesDates[salesDates.length-1]||'';
 return !!closeDate&&(!designSalesFromDate||closeDate>=designSalesFromDate)&&(!designSalesToDate||closeDate<=designSalesToDate);
}
function designSalesDateControls(){return `<div class="design-date-filter" style="display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin:15px 0;padding:14px;border:1px solid #d9e5f4;border-radius:12px;background:#f5f9ff"><div><label for="designSalesFrom">From Date</label><input id="designSalesFrom" type="date" value="${esc(designSalesFromDate)}" onchange="designSalesDateUpdate()"></div><div><label for="designSalesTo">To Date</label><input id="designSalesTo" type="date" value="${esc(designSalesToDate)}" onchange="designSalesDateUpdate()"></div><button type="button" class="secondary" onclick="designSalesClearDates()">Clear Dates</button><div id="designSalesDateError" style="color:#b91c1c"></div></div>`}
function designSalesPercentReport(){
 const byDesign=new Map((db.products||[]).map(p=>[String(p.design),0]));
 for(const o of (db.orders||[]).filter(designSalesOrderInRange)){
  for(const [design,value] of Object.entries(o.closed||{})){
   const n=Number(value)||0;
   if(n>0)byDesign.set(String(design),(byDesign.get(String(design))||0)+n);
  }
 }
 const total=[...byDesign.values()].reduce((a,b)=>a+b,0);
 const entries=[...byDesign].sort((a,b)=>((total ? (b[1]/total*100) : 0)-(total ? (a[1]/total*100) : 0))||a[0].localeCompare(b[0],undefined,{numeric:true}));
 let h='<section><h2>DESIGN SALES % WISE</h2><p class="hint">બધા Closed Orders માંથી દરેક Design નો Sales Percentage. Open Orders ગણાશે નહીં. Sales % High to Low પ્રમાણે ક્રમમાં છે; 0% Design છેલ્લે દેખાશે.</p>';
 h+=designSalesDateControls();

(function(){
 const navNames=/^(?:show|showLedgerClosedOrders|showLedgerFullClosedOrder|backToLedgerParties|openDesignPartyClosedSales|showDesignPartyClosedSales|backToSelectedDesignSales|showHighSellingDesign|backToHighSellingDesign|toggleOrderDetails|togglePurchaseDetails|toggleProductDetails|viewClosedOrder|viewOpenOrder|viewPurchase|viewSalesReturn|viewPurchaseReturn)\s*\(/;
 const snapshots=new Map();let nextId=0,restoring=false;
 function capture(){
  const root=document.getElementById('screen');if(!root)return null;
  const fields=[...root.querySelectorAll('input,select,textarea')].map((el,i)=>({i,value:el.value,checked:el.checked}));
  return {page,html:root.innerHTML,fields,scrollY:window.scrollY,selectedDesign:typeof selectedDesignPartySales!=='undefined'?selectedDesignPartySales:null};
 }

 history.replaceState({...history.state,decorNavId:nextId},'');
 document.addEventListener('click',function(e){
  if(restoring)return;
  const el=e.target.closest('[onclick]');if(!el)return;
  const action=(el.getAttribute('onclick')||'').trim();
  if(!navNames.test(action))return;
  saveCurrent();
  history.pushState({decorNavId:++nextId},'');
 },true);
 window.addEventListener('popstate',function(e){
  const id=e.state&&e.state.decorNavId;
  const snap=snapshots.get(id);
  if(!snap){if(id===0){page='Stock';render()}return}

  restoring=false;
 });

let monthlyYearFilter=String(new Date().getFullYear()),monthlySelectedMonth='',monthlyCompareA='',monthlyCompareB='';

function monthlyClosedData(){
 const data={};
 for(const o of db.orders||[]){
  const closed=Object.entries(o.closed||{}).filter(([d,n])=>Number(n)>0);
  if(!closed.length)continue;
  const sales=(db.tx||[]).filter(t=>t.kind==='Sales'&&t.orderId===o.id);
  const date=ledgerISODate(o.closeDate||sales[0]?.date||'');
  if(!date)continue;
  const month=date.slice(0,7);
  if(!data[month])data[month]={total:0,designs:{}};
  for(const [design,n] of closed){const v=Number(n);data[month].total+=v;data[month].designs[design]=(data[month].designs[design]||0)+v;}
 }
 return data;
}

  if(!localById.has(id)||!remoteById.has(id))return null;
  if(canonical(localById.get(id))!==canonical(o)||canonical(remoteById.get(id))!==canonical(o))return null;
